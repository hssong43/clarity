[package]
name = "clarity"
version = "0.1.0"
description = "On-demand desktop vision assistant"
authors = ["Clarity"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "clarity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
base64 = "0.22"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.13.3", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.0", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
window-vibrancy = "0.8"
xcap = "0.9.4"

[dev-dependencies]
serde_json = "1.0.151"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"] }
